<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MindFlow - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#6366F1,#8B5CF6);
        font-family:'Segoe UI',sans-serif;
    }

    .login-card{
        width:100%;
        max-width:450px;
        background:white;
        border-radius:25px;
        padding:40px;
        box-shadow:0 20px 40px rgba(0,0,0,0.2);
    }

    .logo{
        text-align:center;
        font-size:2rem;
        font-weight:bold;
        color:#6366F1;
        margin-bottom:10px;
    }

    .subtitle{
        text-align:center;
        color:#6c757d;
        margin-bottom:30px;
    }

    .form-control{
        border-radius:12px;
        padding:12px;
    }

    .btn-login{
        background:#6366F1;
        color:white;
        border:none;
        padding:12px;
        border-radius:12px;
        width:100%;
        font-weight:600;
    }

    .btn-login:hover{
        background:#4f46e5;
    }

    .register-link{
        text-align:center;
        margin-top:20px;
    }

    .register-link a{
        color:#6366F1;
        text-decoration:none;
        font-weight:600;
    }
</style>


</head>
<body>

<div class="login-card">


<div class="logo">💜 MindFlow</div>
<p class="subtitle">Welcome Back</p>

<form method="POST">

    <div class="mb-3">
        <input type="email"
               class="form-control"
               name="email"
               placeholder="Email Address"
               required>
    </div>

    <div class="mb-4">
        <input type="password"
               class="form-control"
               name="password"
               placeholder="Password"
               required>
    </div>

    <button type="submit" class="btn btn-login">
        Login
    </button>

</form>

<div class="register-link">
    Don't have an account?
    <a href="/register">Register Here</a>
</div>


</div>

</body>
</html>
