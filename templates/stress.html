
<!DOCTYPE html>
<html>
<head>
    <title>Stress Assessment</title>
</head>
<body>

<h2>Stress Assessment Test</h2>

<form method="POST">

    <p>1. How often do you feel stressed?</p>
    <select name="q1">
        <option value="1">Rarely</option>
        <option value="2">Sometimes</option>
        <option value="3">Often</option>
        <option value="4">Always</option>
    </select>

    <br><br>

    <p>2. Do you have trouble sleeping?</p>
    <select name="q2">
        <option value="1">No</option>
        <option value="2">Occasionally</option>
        <option value="3">Frequently</option>
        <option value="4">Everyday</option>
    </select>

    <br><br>

    <p>3. Do you find it difficult to concentrate?</p>
    <select name="q3">
        <option value="1">No</option>
        <option value="2">Sometimes</option>
        <option value="3">Often</option>
        <option value="4">Always</option>
    </select>

    <br><br>

    <button type="submit">Submit Assessment</button>

</form>

</body>
</html>
