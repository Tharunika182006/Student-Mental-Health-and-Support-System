<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MindFlow - Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#6366F1,#8B5CF6);
        font-family:'Segoe UI',sans-serif;
        padding:30px;
    }

    .register-card{
        width:100%;
        max-width:700px;
        background:white;
        border-radius:25px;
        padding:40px;
        box-shadow:0 20px 40px rgba(0,0,0,0.2);
    }

    .logo{
        text-align:center;
        font-size:2rem;
        font-weight:bold;
        color:#6366F1;
        margin-bottom:10px;
    }

    .subtitle{
        text-align:center;
        color:#6c757d;
        margin-bottom:30px;
    }

    .form-control,
    .form-select{
        border-radius:12px;
        padding:12px;
    }

    .btn-register{
        background:#6366F1;
        color:white;
        border:none;
        padding:12px;
        border-radius:12px;
        width:100%;
        font-weight:600;
    }

    .btn-register:hover{
        background:#4f46e5;
    }

    .login-link{
        text-align:center;
        margin-top:20px;
    }

    .login-link a{
        color:#6366F1;
        text-decoration:none;
        font-weight:600;
    }
</style>


</head>
<body>

<div class="register-card">


<div class="logo">💜 MindFlow</div>
<p class="subtitle">Create Your Student Wellbeing Account</p>

<form method="POST">

    <div class="row">

        <div class="col-md-12 mb-3">
            <input type="text" class="form-control" name="full_name" placeholder="Full Name" required>
        </div>

        <div class="col-md-12 mb-3">
            <input type="email" class="form-control" name="email" placeholder="Email Address" required>
        </div>

        <div class="col-md-12 mb-3">
            <input type="password" class="form-control" name="password" placeholder="Password" required>
        </div>

        <div class="col-md-6 mb-3">
            <input type="text" class="form-control" name="department" placeholder="Department">
        </div>

        <div class="col-md-6 mb-3">
            <input type="text" class="form-control" name="year_of_study" placeholder="Year of Study">
        </div>

        <div class="col-md-6 mb-3">
            <label>Date of Birth</label>
            <input type="date" class="form-control" name="dob">
        </div>

        <div class="col-md-6 mb-3">
            <label>Gender</label>
            <select class="form-select" name="gender">
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>
        </div>

        <div class="col-md-6 mb-3">
            <input type="text" class="form-control" name="emergency_contact_name" placeholder="Emergency Contact Name">
        </div>

        <div class="col-md-6 mb-3">
            <input type="text" class="form-control" name="emergency_contact_number" placeholder="Emergency Contact Number">
        </div>

    </div>

    <button type="submit" class="btn btn-register">
        Create Account
    </button>

</form>

<div class="login-link">
    Already have an account?
    <a href="/login">Login Here</a>
</div>


</div>

</body>
</html>
