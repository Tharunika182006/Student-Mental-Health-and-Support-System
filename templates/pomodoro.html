<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Focus Session | MindFlow</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#6d28d9,#8b5cf6,#a855f7);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.container{
    width:100%;
    max-width:900px;
}

.card{
    background:white;
    border-radius:30px;
    padding:40px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.15);
}

.logo{
    font-size:40px;
    margin-bottom:10px;
}

h1{
    color:#6d28d9;
    margin-bottom:10px;
}

.subtitle{
    color:#666;
    margin-bottom:30px;
}

.timer-circle{
    width:280px;
    height:280px;
    margin:auto;
    border-radius:50%;
    background:linear-gradient(135deg,#7c3aed,#9333ea);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    box-shadow:0 15px 40px rgba(124,58,237,.35);
}

.time{
    font-size:60px;
    font-weight:700;
}

.label{
    margin-top:10px;
    font-size:18px;
    opacity:.9;
}

.controls{
    margin-top:35px;
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    border:none;
    padding:14px 25px;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
    transition:.3s;
}

.start{
    background:#22c55e;
    color:white;
}

.pause{
    background:#f59e0b;
    color:white;
}

.reset{
    background:#ef4444;
    color:white;
}

.dashboard{
    background:#7c3aed;
    color:white;
    text-decoration:none;
    display:inline-block;
}

.btn:hover{
    transform:translateY(-3px);
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-top:40px;
}

.stat-card{
    background:#f8f5ff;
    padding:25px;
    border-radius:20px;
}

.stat-card h3{
    color:#6d28d9;
    font-size:30px;
}

.stat-card p{
    color:#666;
    margin-top:5px;
}

.quote{
    margin-top:35px;
    background:#f3e8ff;
    padding:20px;
    border-radius:15px;
    color:#6d28d9;
    font-weight:500;
}

@media(max-width:768px){

.timer-circle{
    width:220px;
    height:220px;
}

.time{
    font-size:45px;
}

}

</style>

</head>

<body>

<div class="container">


<div class="card">

    <div class="logo">🍅</div>

    <h1>MindFlow Focus Session</h1>

    <p class="subtitle">
        Stay productive and improve concentration using the Pomodoro Technique
    </p>

    <div class="timer-circle">

        <div>

            <div id="timer" class="time">
                25:00
            </div>

            <div class="label">
                Focus Time
            </div>

        </div>

    </div>

    <div class="controls">

        <button class="btn start" onclick="startTimer()">
            ▶ Start
        </button>

        <button class="btn pause" onclick="pauseTimer()">
            ⏸ Pause
        </button>

        <button class="btn reset" onclick="resetTimer()">
            🔄 Reset
        </button>

        <a href="/dashboard" class="btn dashboard">
            🏠 Dashboard
        </a>

    </div>

    <div class="stats">

        <div class="stat-card">
            <h3>25</h3>
            <p>Minutes Focus</p>
        </div>

        <div class="stat-card">
            <h3>5</h3>
            <p>Minutes Break</p>
        </div>

        <div class="stat-card">
            <h3>4</h3>
            <p>Sessions Goal</p>
        </div>

    </div>

    <div class="quote">
        💜 "Small focused sessions every day create extraordinary results."
    </div>

</div>


</div>

<script>

let time = 25 * 60;
let timerRunning = false;
let interval;

function updateDisplay(){

    let minutes = Math.floor(time / 60);
    let seconds = time % 60;

    document.getElementById("timer").innerHTML =
        String(minutes).padStart(2,'0') + ":" +
        String(seconds).padStart(2,'0');
}

function startTimer(){

    if(timerRunning) return;

    timerRunning = true;

    interval = setInterval(()=>{

        if(time > 0){

            time--;
            updateDisplay();

        }else{

            clearInterval(interval);

            alert("🎉 Focus Session Completed!");

            timerRunning = false;
        }

    },1000);
}

function pauseTimer(){

    clearInterval(interval);
    timerRunning = false;
}

function resetTimer(){

    clearInterval(interval);

    timerRunning = false;

    time = 25 * 60;

    updateDisplay();
}

updateDisplay();

</script>

</body>
</html>
